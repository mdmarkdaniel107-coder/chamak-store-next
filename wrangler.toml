name = "chamak-store-next"
main = "src/index.js"
compatibility_date = "2026-10-08"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "chamak-store-next-db"
database_id = "REPLACE_WITH_NEW_D1_DATABASE_ID"
migrations_dir = "migrations"
